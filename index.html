<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Small Biz Digital Solutions: coming soon</title>
  <meta name="description" content="Small Biz Digital Solutions sets up small business websites, domains, and professional email in your name. Our site is launching soon.">
  <style>
    :root { --bg:#0e141b; --text:#e8edf3; --muted:#aab6c5; --accent:#e4b24c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--bg); color: var(--text);
      font: 1.0625rem/1.6 "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    }
    main { max-width: 34rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.1; letter-spacing: -0.02em; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #8fd0ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Small Biz Digital Solutions</h1>
    <p>We set up your small business website, domain, and professional email in your name. Our full site is launching soon.</p>
    <p>Questions in the meantime? Email <a href="mailto:hello@smallbizdigitalsolutions.com">hello@smallbizdigitalsolutions.com</a>.</p>
  </main>
</body>
</html>
